name: Asset correction or request
description: Request a new icon, correct artwork, improve attribution or ask for removal.
title: "[Asset] "
body:
  - type: input
    id: entity
    attributes:
      label: Entity or brand
      placeholder: Name and Aurato record ID, if known
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Existing or proposed file path
      placeholder: payment-methods/example-pay.png
  - type: textarea
    id: change
    attributes:
      label: Requested change
      description: Explain the correction, addition, attribution update or removal.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Sources and rights information
      description: Link official public sources or brand guidelines where available. Do not include confidential information.
