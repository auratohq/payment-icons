name: Verify collection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned image validator
        run: python -m pip install -r requirements.txt
      - name: Test validation safeguards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify committed files without fetching replacements
        run: python scripts/collection.py validate
      - name: Check CSV matches the JSON catalog
        run: |
          python scripts/collection.py export
          git diff --exit-code -- catalog.csv
      - name: Check gallery JavaScript
        run: node --check gallery/app.js

  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Test gallery on desktop and mobile
        run: npm run test:gallery
      - name: Save gallery screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 14
